spring.application.name=demo-dog

# Actuator: expose only the health endpoint over HTTP
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Enable liveness/readiness probes (/actuator/health/liveness, /actuator/health/readiness)
management.endpoint.health.probes.enabled=true

# Datasource (MySQL). Override with DB_URL / DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
